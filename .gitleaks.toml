# gitleaks configuration: the default rules, plus one narrow exception.
# paper/refcheck/*.json record references with a line "key": "<citation key>"; the generic-api-key rule reads the
# citation keys as secrets. Only lines that consist of exactly such a key are exempt.
[extend]
useDefault = true

[allowlist]
description = "citation keys in the reference check records"
regexTarget = "line"
regexes = ['''^\s*"key": "[A-Za-z][A-Za-z0-9_]*",\s*$''']
